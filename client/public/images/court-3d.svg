<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Isometric padel court" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="surf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe63a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bfe63a" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="300" cy="352" rx="250" ry="30" fill="#0f1a16" opacity="0.08"/>

  <!-- isometric court. screen = (300 + 0.866(x-y), 210 + 0.5(x+y))
       apron corners: A(-105,-195)->(378,60) B(105,-195)->(560,165)
                      C(105,195)->(222,360)  D(-105,195)->(40,255) -->
  <g transform="translate(300 210) matrix(0.866 0.5 -0.866 0.5 0 0)">
    <!-- green apron -->
    <rect x="-105" y="-195" width="210" height="390" rx="6" fill="#2f855a"/>
    <rect x="-105" y="-195" width="210" height="390" rx="6" fill="none" stroke="#256b48" stroke-width="4"/>

    <!-- playing surface -->
    <rect x="-90" y="-180" width="180" height="360" fill="url(#surf)"/>

    <!-- white court lines -->
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <rect x="-90" y="-180" width="180" height="360"/>
      <line x1="-90" y1="-62" x2="90" y2="-62"/>
      <line x1="-90" y1="62" x2="90" y2="62"/>
      <line x1="0" y1="-62" x2="0" y2="62"/>
    </g>

    <!-- net shadow on surface -->
    <line x1="-90" y1="4" x2="90" y2="4" stroke="#0f1a16" stroke-width="3" stroke-opacity="0.25"/>
  </g>

  <!-- glass back wall along far short edge A-B (height 60) -->
  <polygon points="378,60 560,165 560,105 378,0" fill="url(#glass)" stroke="#0b3b2e" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- glass wall along far long edge A-D (height 60) -->
  <polygon points="378,60 40,255 40,195 378,0" fill="url(#glass)" stroke="#0b3b2e" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- wall frame posts -->
  <g stroke="#0b3b2e" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round">
    <line x1="378" y1="0" x2="378" y2="60"/>
    <line x1="560" y1="105" x2="560" y2="165"/>
    <line x1="40" y1="195" x2="40" y2="255"/>
    <line x1="469" y1="52" x2="469" y2="112"/>
    <line x1="209" y1="98" x2="209" y2="158"/>
  </g>

  <!-- net (vertical band across court width at iso y=0) -->
  <polygon points="209,158 391,263 391,245 209,140" fill="#0f1a16" fill-opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="209" y1="140" x2="391" y2="245" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#0f1a16" stroke-width="4" stroke-linecap="round">
    <line x1="209" y1="140" x2="209" y2="160"/>
    <line x1="391" y1="245" x2="391" y2="265"/>
  </g>

  <!-- floodlight poles -->
  <g stroke="#0b3b2e" stroke-width="4" stroke-linecap="round">
    <line x1="578" y1="172" x2="578" y2="78"/>
    <line x1="22" y1="262" x2="22" y2="168"/>
  </g>
  <g fill="#0b3b2e">
    <rect x="566" y="68" width="24" height="12" rx="3"/>
    <rect x="10" y="158" width="24" height="12" rx="3"/>
  </g>
  <g fill="#e9e7df">
    <circle cx="578" cy="74" r="3"/>
    <circle cx="22" cy="164" r="3"/>
  </g>

  <!-- ball + racket -->
  <circle cx="332" cy="268" r="6" fill="#d9ff4f" stroke="#ffffff" stroke-width="1.5"/>
  <g transform="translate(262 292) rotate(-35)">
    <ellipse cx="0" cy="0" rx="12" ry="15" fill="#0f1a16"/>
    <ellipse cx="0" cy="0" rx="8" ry="11" fill="#0b3b2e"/>
    <rect x="-2.5" y="14" width="5" height="18" rx="2.5" fill="#0f1a16"/>
  </g>

  <!-- caption pill -->
  <g transform="translate(96 24)">
    <rect x="-80" y="-13" width="160" height="26" rx="13" fill="#0b3b2e"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3f1ea" letter-spacing="1.5">3D COURT PREVIEW</text>
  </g>
</svg>
