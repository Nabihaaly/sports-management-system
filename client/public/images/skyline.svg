    <rect x="300" y="96" width="58" height="64"/>
    <rect x="321" y="56" width="16" height="42"/>
    <polygon points="318,58 340,58 329,42"/>
    <!-- Mazar-e-Quaid style dome -->
    <rect x="378" y="112" width="110" height="48"/>
    <path d="M396 112 a37 37 0 0 1 74 0 z"/>
    <rect x="431" y="66" width="4" height="12"/>
    <!-- minaret -->
    <rect x="500" y="80" width="10" height="80"/>
    <circle cx="505" cy="78" r="6"/>
    <!-- mid rise -->
    <rect x="522" y="100" width="48" height="60"/>
    <!-- MCB Tower style -->
    <rect x="586" y="34" width="46" height="126"/>
    <polygon points="586,34 632,34 609,14"/>
    <rect x="596" y="42" width="6" height="110" fill="#fffbf3" opacity="0.25"/>
    <rect x="614" y="42" width="6" height="110" fill="#fffbf3" opacity="0.25"/>
