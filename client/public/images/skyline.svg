    <rect x="648" y="92" width="34" height="68"/>
    <rect x="682" y="108" width="34" height="52"/>
    <!-- Bahria Icon style twin tower -->
    <rect x="732" y="22" width="30" height="138"/>
    <rect x="766" y="46" width="22" height="114"/>
    <rect x="744" y="8" width="6" height="16"/>
    <!-- low row -->
    <rect x="804" y="114" width="60" height="46"/>
    <rect x="876" y="98" width="38" height="62"/>
    <!-- Ocean Mall style -->
    <rect x="928" y="60" width="52" height="100"/>
    <rect x="938" y="48" width="32" height="14"/>
    <!-- Teen Talwar -->
    <polygon points="1000,160 1006,108 1012,160"/>
    <polygon points="1016,160 1022,100 1028,160"/>
    <polygon points="1032,160 1038,108 1044,160"/>
    <!-- lighthouse / tower -->
    <rect x="1066" y="90" width="18" height="70"/>
    <rect x="1062" y="84" width="26" height="8"/>
    <!-- end blocks -->
    <rect x="1100" y="106" width="52" height="54"/>
    <rect x="1162" y="120" width="38" height="40"/>
    <!-- ground line -->
    <rect x="0" y="156" width="1200" height="4"/>
  </g>

  <!-- accent windows / highlights in terracotta -->
  <g fill="#c8502a">
    <rect x="150" y="64" width="6" height="6"/>
    <rect x="166" y="64" width="6" height="6"/>
    <rect x="150" y="80" width="6" height="6"/>
