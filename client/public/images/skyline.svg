    <rect x="60" y="76" width="30" height="84"/>
    <rect x="104" y="98" width="56" height="62"/>
    <rect x="172" y="70" width="26" height="90"/>
    <rect x="212" y="88" width="64" height="72"/>
    <rect x="290" y="60" width="22" height="100"/>
    <rect x="326" y="94" width="48" height="66"/>
    <rect x="388" y="80" width="40" height="80"/>
    <rect x="442" y="104" width="70" height="56"/>
    <rect x="526" y="66" width="28" height="94"/>
    <rect x="568" y="90" width="54" height="70"/>
    <rect x="636" y="72" width="34" height="88"/>
